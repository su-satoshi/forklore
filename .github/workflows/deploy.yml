name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to the gh-pages branch.
# GitHub Pages serves that branch (Settings > Pages > Deploy from a branch > gh-pages / root).
# Actions are pinned to exact commits so an upstream tag change can't alter what runs here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: dist
          clean: true
